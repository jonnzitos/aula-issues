<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo HTML</title>
</head>
<body>

    <header>
        <h1>O que é HTML?</h1>
        <h2>Conhecendo a linguagem de marcação da web</h2>

        <p>
            HTML (HyperText Markup Language) é uma linguagem de marcação
            utilizada para estruturar páginas da web. Por meio de suas
            tags, podemos adicionar textos, imagens, links, vídeos e
            diversos outros elementos a um site.
        </p>

        <button>Saiba mais</button>
    </header>

</body>
</html>
